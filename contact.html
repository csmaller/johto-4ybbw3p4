<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <style>
    body { margin: 0; padding: 2rem 1rem; background: #f7f7f8; color: #1f2328; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; margin: 0 auto; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { box-sizing: border-box; width: 100%; margin-top: .25rem; padding: .6rem; border: 1px solid #8a9099; border-radius: 4px; font: inherit; }
    textarea { min-height: 9rem; resize: vertical; }
    [aria-invalid="true"] { border-color: #b3261e; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; border: 0; border-radius: 4px; background: #1f5fbf; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .hint { margin: .25rem 0 0; color: #565c65; font-size: .875rem; }
    .error { margin: .25rem 0 0; color: #b3261e; font-size: .875rem; }
    .error:empty { display: none; }
    #form-status { margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Contact Us</h1>
    <form id="contact-form" action="/contact" method="post" novalidate>
      <label for="email">Your email</label>
      <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
      <p id="email-error" class="error" role="alert"></p>

      <label for="message">Message</label>
      <textarea id="message" name="message" aria-describedby="message-count message-error"></textarea>
      <p id="message-count" class="hint"></p>
      <p id="message-error" class="error" role="alert"></p>

      <button type="submit">Send message</button>
      <p id="form-status" role="status"></p>
    </form>
  </main>

  <script>
    // Message length limits are exclusive: 21 to 399 characters are accepted.
    const MESSAGE_MIN_EXCLUSIVE = 20;
    const MESSAGE_MAX_EXCLUSIVE = 400;
    const EMAIL_PATTERN = /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/;

    function validateEmail(value) {
      const email = value.trim();
      if (!email) return 'Please enter your email address.';
      if (!EMAIL_PATTERN.test(email)) return 'Please enter a valid email address, like name@example.com.';
      return '';
    }

    function validateMessage(value) {
      const length = value.trim().length;
      if (length <= MESSAGE_MIN_EXCLUSIVE) return `Your message must be more than ${MESSAGE_MIN_EXCLUSIVE} characters.`;
      if (length >= MESSAGE_MAX_EXCLUSIVE) return `Your message must be fewer than ${MESSAGE_MAX_EXCLUSIVE} characters.`;
      return '';
    }

    const form = document.getElementById('contact-form');
    const email = document.getElementById('email');
    const message = document.getElementById('message');
    const count = document.getElementById('message-count');
    const status = document.getElementById('form-status');
    const button = form.querySelector('button');

    function showResult(field, errorId, error) {
      document.getElementById(errorId).textContent = error;
      field.setAttribute('aria-invalid', String(Boolean(error)));
      return !error;
    }

    const checkEmail = () => showResult(email, 'email-error', validateEmail(email.value));
    const checkMessage = () => showResult(message, 'message-error', validateMessage(message.value));

    function updateCount() {
      count.textContent = `${message.value.trim().length} characters (21 to 399 allowed)`;
    }

    email.addEventListener('blur', checkEmail);
    message.addEventListener('blur', checkMessage);
    message.addEventListener('input', updateCount);
    updateCount();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = '';

      const emailOk = checkEmail();
      const messageOk = checkMessage();
      if (!emailOk || !messageOk) {
        (emailOk ? message : email).focus();
        return;
      }

      button.disabled = true;
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim(), message: message.value.trim() }),
        });
        if (!response.ok) throw new Error(`Unexpected status ${response.status}`);
        form.reset();
        updateCount();
        status.textContent = 'Thanks! Your message has been sent.';
      } catch {
        status.textContent = 'Sorry, your message could not be sent. Please try again later.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
